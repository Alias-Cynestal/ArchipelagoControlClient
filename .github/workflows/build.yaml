name: Build Control Archipelago Client And Patcher
on:
  push:
    tags:
      - '*'
    branches:
        - 'main'
  workflow_dispatch:

jobs:
build:
  runs-on: windows-latest

  steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        cache: true
    - run: dotnet restore --locked-mode
    - run: dotnet build Ap.Control
    - run: cd Ap.Control.Patcher
    - run: dotnet restore --locked-mode
    - run: dotnet build Ap.Control.Patcher